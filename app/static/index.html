<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Only this server's own files may run or load. No inline scripts, no CDNs (OT-SR-006). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>OT Management System</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/ui/css/style.css">
  <script type="module" src="/ui/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="app-header">
    <span class="app-name">OT Management System</span>
    <!-- Filled by app.js with only the links the user's role may use -->
    <nav id="main-nav" aria-label="Main" hidden></nav>
    <div class="header-tools">
      <span id="user-info" class="user-info" hidden></span>
      <button type="button" id="theme-toggle" class="button-quiet" aria-pressed="false">High contrast</button>
      <button type="button" id="logout-button" class="button-quiet" hidden>Log out</button>
    </div>
  </header>

  <!-- SAD 4.5: prominent emergency banner. Shown after login. -->
  <div id="emergency-banner" class="emergency-banner" hidden>
    <span id="emergency-count" class="emergency-count">⚠ Emergency</span>
    <a id="emergency-button" class="button button-emergency" href="#emergencies" hidden>⚠ Log emergency</a>
  </div>

  <main id="main" tabindex="-1">
    <!-- Messages for screen readers and sighted users (errors, success, loading) -->
    <div id="global-message" class="message" role="status" aria-live="polite" hidden></div>

    <section id="login-view" class="card login-card" aria-labelledby="login-title" hidden>
      <h1 id="login-title">Sign in</h1>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" name="username" autocomplete="username" required maxlength="50">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="128">
        </div>
        <div id="login-error" class="message message-error" role="alert" hidden></div>
        <button type="submit" class="button">Sign in</button>
      </form>
    </section>

    <!-- Each screen draws itself into this element -->
    <div id="view"></div>
  </main>
</body>
</html>
